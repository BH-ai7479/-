<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOSDAQ 150 그룹별 시가총액 변화</title>
<style>body{margin:0;background:#fff;color:#222;font-family:Arial,"Malgun Gothic","Noto Sans CJK KR",sans-serif}
svg{display:block;width:100%;height:auto}</style></head><body>
<svg id="c" viewBox="0 0 2400 1300" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// [그룹, 종목수, 2026-01-02 시총(W Bil.), 2026-10-08 시총(W Bil.)]  출처: 엑셀 첫 번째 탭 (KOSDAQ150_주간 Hitmap)
const D = [["바이오/헬스케어",28,111960.3,69981.0],["IT/반도체",57,74633.7,130062.4],["2차전지/소재",14,38266.9,38996.3],["산업재/기계/전력",21,33345.2,31678.2],["엔터/게임/소비재",26,28329.7,19793.9],["금융/지주",4,3190.5,3145.6]];
const GREEN='#2fb35a', RED='#e0343c', BLUE='#5b6475', LIGHT='#b3bccd', DARK='#2b3550', F='font-family="Arial, Malgun Gothic, Noto Sans CJK KR, sans-serif"';
const fmt = v => Math.round(v).toLocaleString();
const sg = v => (v>=0?'+':'-') + fmt(Math.abs(v));
const pc = v => (v>=0?'+':'') + v.toFixed(1) + '%';
const A = D.reduce((s,x)=>s+x[2],0), B = D.reduce((s,x)=>s+x[3],0);
let o = '<rect width="2400" height="1300" fill="#ffffff"/>';
const T = (x,y,s,t,c='#1b1d22',w='normal',a='start') => `<text x="${x}" y="${y}" font-size="${s}" font-weight="${w}" fill="${c}" text-anchor="${a}" ${F}>${t}</text>`;
o += T(40,64,44,'KOSDAQ 150 그룹별 시가총액 변화 (2026-01-02 → 2026-10-08)','#1b1d22','bold');
o += T(40,104,24,`전체 ${fmt(A)} → ${fmt(B)} (W Bil.)  ${pc((B/A-1)*100)}  ·  그룹 간 이동: 바이오/헬스케어·엔터/게임/소비재 ↓, IT/반도체 ↑`,'#666');
{ const x0=90,y0=190,w=1000,h=880, max=360000, ys=v=>y0+h-(v/max)*h;
  o += T(40,160,30,'① 전체 시가총액 증감 기여 (W Bil.)','#1b1d22','bold');
  for(let v=0;v<=max;v+=60000){ o+=`<line x1="${x0}" x2="${x0+w}" y1="${ys(v)}" y2="${ys(v)}" stroke="#e3e6ec"/>`+T(x0-8,ys(v)+6,20,fmt(v),'#666','normal','end'); }
  const bars=[['1/2 합계',0,A,BLUE,fmt(A)]]; let cur=A;
  for(const [g,n,a,b] of D){ const dl=b-a; bars.push([g,cur,cur+dl,dl>=0?GREEN:RED,sg(dl)]); cur+=dl; }
  bars.push(['10/8 합계',0,B,BLUE,fmt(B)]);
  const bw=w/bars.length;
  bars.forEach(([n,s,e,c,l],i)=>{ const x=x0+i*bw+bw*0.12, ww=bw*0.76, top=ys(Math.max(s,e)), bt=ys(Math.min(s,e));
    o+=`<rect x="${x}" y="${top}" width="${ww}" height="${Math.max(bt-top,2)}" fill="${c}"/>`;
    o+=T(x+ww/2,top-10,22,l,'#1b1d22','bold','middle');
    const lines = n.includes('/') && n.length>6 && !n.includes('합계') ? [n.split('/')[0]+'/', n.split('/').slice(1).join('/')] : [n];
    lines.forEach((t,k)=>o+=T(x+ww/2,y0+h+30+k*26,20,t,'#444','normal','middle'));
    if(i<bars.length-1) o+=`<line x1="${x+ww}" x2="${x+bw}" y1="${ys(e)}" y2="${ys(e)}" stroke="#666" stroke-dasharray="4 4"/>`; });
}
{ const x0=1220,y0=190,w=1100,rowH=150, max=Math.max(...D.map(x=>Math.max(x[2],x[3]))), sx=v=>(v/max)*(w-330);
  o += T(x0,160,30,'② 그룹별 시가총액: 1/2 vs 10/8 (W Bil.)','#1b1d22','bold');
  o += `<rect x="${x0}" y="${y0-12}" width="18" height="18" fill="${LIGHT}"/>`+T(x0+26,y0+4,20,'2026-01-02','#444');
  o += `<rect x="${x0+160}" y="${y0-12}" width="18" height="18" fill="${DARK}"/>`+T(x0+186,y0+4,20,'2026-10-08','#444');
  D.forEach(([g,n,a,b],i)=>{ const y=y0+40+i*rowH, ch=(b/a-1)*100, c=ch>=0?GREEN:RED;
    o+=T(x0,y+22,26,g,'#1b1d22','bold')+T(x0+g.length*27+14,y+22,20,`${n}종목`,'#777');
    o+=`<rect x="${x0}" y="${y+36}" width="${sx(a)}" height="38" fill="${LIGHT}"/>`+T(x0+sx(a)+10,y+63,22,fmt(a),'#666');
    o+=`<rect x="${x0}" y="${y+78}" width="${sx(b)}" height="38" fill="${DARK}"/>`+T(x0+sx(b)+10,y+105,22,fmt(b),'#1b1d22');
    o+=`<rect x="${x0+w-190}" y="${y+36}" width="190" height="80" rx="6" fill="${c}"/>`+T(x0+w-95,y+88,40,pc(ch),'#fff','bold','middle');
  });
}
o += T(40,1270,20,'시가총액 = 발행주식수 × 종가 (엑셀 MKT Cap 열 그룹 합계, 컬럼 K 기준 · 150종목). 초록=증가, 빨강=감소.','#666');
document.getElementById('c').innerHTML=o;
</script></body></html>
